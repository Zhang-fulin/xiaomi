<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小米集团 (01810.HK) 持仓市值实时计算器</title>
    <style>
        /* ========================
           深色主题配色变量 (Dark Mode)
           ======================== */
        :root {
            color-scheme: dark;
            --primary: #ff6700;
            --primary-hover: #f25800;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #9e9e9e;
            --border-color: #333333;
            --profit-red: #ff5252;
            --loss-green: #4caf50;
            --info-blue: #448aff;
            --table-header-bg: #282828;
            --input-bg: #2a2a2a;
            --input-bg-focus: #333333;
            --section-bg: #242424;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            position: relative; /* 为右上角刷新按钮提供定位基准 */
            width: 100%;
            max-width: 1400px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 32px;
        }

        /* 容器右上角刷新网页按钮 */
        .page-reload-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .page-reload-btn:hover {
            color: var(--text-main);
            border-color: var(--primary);
            background-color: var(--input-bg-focus);
        }

        .page-reload-btn:active svg {
            transform: rotate(180deg);
        }

        .page-reload-btn svg {
            transition: transform 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .mi-logo-img {
            width: 32px;
            height: 32px;
            display: inline-block;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6700, #ffab91);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        /* 顶部行情数据栏 */
        .market-status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .market-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .market-label {
            color: var(--text-muted);
        }

        .market-value {
            font-weight: 700;
        }

        /* 主体左右布局容器：上下高度完全拉齐 */
        .main-layout {
            display: flex;
            gap: 32px;
            align-items: stretch;
        }

        /* 左侧：支撑整体高度的主体 */
        .left-panel {
            flex: 0 0 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 右侧：开启相对定位，高度跟随左侧 */
        .right-panel {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        /* 结果面板（左侧上半部） */
        .results-section {
            background-color: var(--section-bg);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .result-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        .result-card:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 2px;
            position: relative;
            padding-left: 12px;
        }

        .result-label::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        .result-value {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }
        
        .multi-value {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .sub-value {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .progress-box {
            margin-top: 16px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            height: 10px;
            background-color: var(--border-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9f43, #ff6700);
            width: 0%;
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        /* 输入参数网格（左侧下半部） */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
            background-color: var(--input-bg);
        }

        /* 隐藏 Chrome, Safari, Edge, Opera 的上下微调按钮 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 隐藏 Firefox 的上下微调按钮 */
        input[type=number] {
            -moz-appearance: textfield;
        }

        input:focus {
            border-color: var(--primary);
            background-color: var(--input-bg-focus);
            box-shadow: 0 0 0 3px rgba(255, 103, 0, 0.15);
        }

        .price-input-wrapper {
            position: relative;
        }

        .price-input-wrapper input {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            padding-right: 60px;
        }

        .price-input-wrapper .unit {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 14px;
        }

        .refresh-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 11px;
            color: var(--info-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover {
            background-color: var(--border-color);
        }

        .refresh-btn.spinning svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .status-tag {
            font-size: 11px;
            font-weight: normal;
            color: var(--loss-green);
        }

        .status-tag.error {
            color: var(--profit-red);
        }

        .is-profit { color: var(--profit-red) !important; }
        .is-loss { color: var(--loss-green) !important; }

        /* 绝对定位锁死：严格限制右侧高度等同于左侧，超出一律内部滚动 */
        .table-wrapper {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            overflow-y: auto;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 13px;
            background-color: var(--card-bg);
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        tr:last-child td {
            border-bottom: none;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--table-header-bg);
            color: var(--text-main);
            font-weight: 600;
            z-index: 1;
        }

        tr:nth-child(even) td {
            background-color: var(--section-bg);
        }

        .highlight-cell {
            font-weight: 700;
            color: var(--primary);
        }
        
        /* 滚动条深色美化 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color); 
        }
        ::-webkit-scrollbar-thumb {
            background: #555; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #777; 
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 右上角刷新网页按钮 -->
    <button class="page-reload-btn" onclick="location.reload()" title="刷新页面">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>

    </button>

    <div class="header">
        <div class="title-wrapper">
            <!-- 小米官方 Logo SVG -->
            <svg class="mi-logo-img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 808">
                <g>
                    <path fill="#ff6900" d="M723.79,84.42C647.55,8.48,537.94,0,404,0,269.89,0,160.12,8.58,83.92,84.72S0,270.43,0,404.39,7.74,648,84,724.14,269.9,808,404,808s243.85-7.71,320-83.86,84-185.78,84-319.75C808,270.25,800.16,160.54,723.79,84.42Z"></path>
                    <path fill="#fff" d="M374.26,553.72a5,5,0,0,1-5.06,5H300.3a5.05,5.05,0,0,1-5.12-5V373.53a5.05,5.05,0,0,1,5.12-5h68.9a5,5,0,0,1,5.06,5Z"></path>
                    <path fill="#fff" d="M509.18,553.72a5.05,5.05,0,0,1-5.09,5H438.5a5,5,0,0,1-5.1-5V398.26c-.07-27.15-1.62-55-15.64-69.06-12-12.09-34.51-14.86-57.88-15.44H241a5,5,0,0,0-5.07,5v235a5.07,5.07,0,0,1-5.12,5H165.16a5,5,0,0,1-5.06-5V254.31a5,5,0,0,1,5.06-5H354.52c49.49,0,101.22,2.26,126.74,27.81s27.92,77.3,27.92,126.85Z"></path>
                    <path fill="#fff" d="M644.29,553.72a5.06,5.06,0,0,1-5.09,5H573.57a5,5,0,0,1-5.08-5V254.31a5,5,0,0,1,5.08-5H639.2a5.06,5.06,0,0,1,5.09,5Z"></path>
                </g>
            </svg>
            <h1>小米集团 (01810.HK) 持仓测算</h1>
        </div>

        <!-- 顶部核心行情栏 -->
        <div class="market-status-bar">
            <div class="market-item">
                <span class="market-label">昨收基准:</span>
                <span class="market-value" id="prevCloseDisplay">-- HKD</span>
            </div>
            <div class="market-item">
                <span class="market-label">今日涨跌:</span>
                <span class="market-value" id="changePercentDisplay">--%</span>
            </div>
        </div>
    </div>

    <!-- 左右并排容器 -->
    <div class="main-layout">
        <!-- 左侧栏：上半部为测算结果，下半部为输入参数 -->
        <div class="left-panel">
            <!-- 上半部：测算结果面板 -->
            <div class="results-section">
                <!-- 成本显示 -->
                <div class="result-card">
                    <span class="result-label">成本</span>
                    <div class="result-value multi-value">
                        <span id="costHkd" style="color: #ffab91;">0.00 HKD</span>

                <!-- 市值显示 -->
                <div class="result-card">
                    <span class="result-label">市值</span>
                    <div class="result-value multi-value">

                        <span id="valRmb" class="sub-value" style="color: var(--primary);">¥ 0.00</span>

                <!-- 盈亏显示 -->
                <div class="result-card">
                    <span class="result-label">盈亏</span>
                    <div class="result-value multi-value" id="profitContainer">
                        <span id="profitHkd">0.00 HKD</span>
                        <span id="profitRmb" class="sub-value">¥ 0.00</span>
                        <span id="profitPercent" class="sub-value" style="color: var(--profit-red);">0.00%</span>

                <div class="progress-box">
                    <div class="progress-header">
                        <span>目标完成度</span>

                <div class="form-group">

                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>

                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>

                    <input type="number" id="costPrice" step="0.001" max="500">

                <div class="form-group">
                    <label for="monthlyInvest">月定投 (RMB)</label>
                    <input type="number" id="monthlyInvest" step="1000" max="50000">
                </div>

<script>
    // 默认配置常量
    const DEFAULT_COST_PRICE = 43.556;    // 买入成本 (HKD)
    const DEFAULT_SHARE_COUNT = 23600;    // 持股数 (股)
    const DEFAULT_MONTHLY_INVEST = 10000; // 月定投 (RMB)
    const DEFAULT_TARGET_RMB = 4000000;   // 目标市值 (RMB)

    // 初始化输入框默认值
    document.getElementById('costPrice').value = DEFAULT_COST_PRICE;
    document.getElementById('shareCount').value = DEFAULT_SHARE_COUNT;
    document.getElementById('monthlyInvest').value = DEFAULT_MONTHLY_INVEST;
    document.getElementById('targetRmb').value = DEFAULT_TARGET_RMB;

    function generateQuarterlyNodes() {
        const nodes = [];
        const startYear = 2026;
        const endYear = 2036;

        for (let y = startYear; y <= endYear; y++) {
            for (let m = 3; m <= 12; m += 3) {
                if (y === 2026 && m < 9) continue;
                nodes.push({ year: y, month: m });
            }
        }
        return nodes;
    }

    function getRemainingMonths(targetYear, targetMonth) {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth() + 1;
        return (targetYear - currentYear) * 12 + (targetMonth - currentMonth);
    }

    function solveLinearTarget(startPrice, initShares, initCostHkd, monthlyInvestHkd, months, targetHkd) {
        let lowPrice = 0.01;
        let highPrice = 500.0;
        let midPrice = startPrice;
        let finalShares = initShares;

        for (let iter = 0; iter < 30; iter++) {
            midPrice = (lowPrice + highPrice) / 2;
            let accumShares = initShares;
            for (let m = 1; m <= months; m++) {
                let priceAtMonth = startPrice + (m / months) * (midPrice - startPrice);
                if (priceAtMonth <= 0) priceAtMonth = 0.01;
                accumShares += (monthlyInvestHkd / priceAtMonth);
            }

            let endVal = accumShares * midPrice;
            if (endVal < targetHkd) {
                lowPrice = midPrice;
            } else {
                highPrice = midPrice;
            }
            finalShares = accumShares;
        }

        const totalCostHkd = (initShares * initCostHkd) + (monthlyInvestHkd * months);
        const avgCostPrice = totalCostHkd / finalShares;
        const profitHkd = targetHkd - totalCostHkd;
        const profitRate = avgCostPrice > 0 ? ((midPrice - avgCostPrice) / avgCostPrice) * 100 : 0;

        return {
            targetPrice: midPrice,
            totalShares: finalShares,
            totalCostHkd: totalCostHkd,
            profitHkd: profitHkd,
            avgCostPrice: avgCostPrice,
            profitRate: profitRate
        };
    }

    function calculate() {
        const price = parseFloat(document.getElementById('currentPrice').value) || 0.01;
        const initShares = parseFloat(document.getElementById('shareCount').value) || 0;
        const cost = parseFloat(document.getElementById('costPrice').value) || 0;
        const monthlyInvestRmb = parseFloat(document.getElementById('monthlyInvest').value) || 0;
        const rate = parseFloat(document.getElementById('exchangeRate').value) || 1.1577;
        const targetRmb = parseFloat(document.getElementById('targetRmb').value) || 4000000;

        // 1. 核心持仓与成本计算
        const valHkd = price * initShares;
        const valRmb = valHkd / rate;

        const totalCostHkd = cost * initShares;
        const totalCostRmb = totalCostHkd / rate;

        const profitHkd = valHkd - totalCostHkd;
        const profitRmb = profitHkd / rate;
        const profitRate = totalCostHkd > 0 ? (profitHkd / totalCostHkd) * 100 : 0;

        const progress = Math.min((valRmb / targetRmb) * 100, 100);

        // 2. 更新已投入成本
        document.getElementById('costHkd').innerText = totalCostHkd.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' HKD';
        document.getElementById('costRmb').innerText = '¥ ' + totalCostRmb.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // 3. 更新持仓市值
        document.getElementById('valHkd').innerText = valHkd.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' HKD';
        document.getElementById('valRmb').innerText = '¥ ' + valRmb.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // 4. 更新持仓盈亏
        const profitSign = profitHkd >= 0 ? '+' : '';
        const profitHkdText = `${profitSign}${profitHkd.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} HKD`;
        const profitRmbText = `¥ ${profitSign}${profitRmb.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        document.getElementById('profitHkd').innerText = profitHkdText;
        document.getElementById('profitRmb').innerText = profitRmbText;

        const profitContainer = document.getElementById('profitContainer');
        const profitRmbElem = document.getElementById('profitRmb');
        if (profitHkd >= 0) {
            profitContainer.className = 'result-value multi-value is-profit';
            profitRmbElem.className = 'sub-value is-profit';
        } else {
            profitContainer.className = 'result-value multi-value is-loss';
            profitRmbElem.className = 'sub-value is-loss';
        }

        document.getElementById('progressBar').style.width = progress.toFixed(2) + '%';
        document.getElementById('progressText').innerText = progress.toFixed(2) + '%';

        // 更新盈亏百分比
        const profitPercent = document.getElementById('profitPercent');
        profitPercent.innerText = `${profitRate >= 0 ? '+' : ''}${profitRate.toFixed(2)}%`;
        if (profitRate >= 0) {
            profitPercent.style.color = 'var(--profit-red)';
        } else {
            profitPercent.style.color = 'var(--loss-green)';
        }

        // 5. 动态生成并计算季度表格
        const targetHkd = targetRmb * rate;
        const monthlyInvestHkd = monthlyInvestRmb * rate;
        const priceTableBody = document.getElementById('priceTableBody');
        const quarterNodes = generateQuarterlyNodes();
        let priceRowsHtml = '';

        quarterNodes.forEach(node => {
            const months = getRemainingMonths(node.year, node.month);
            if (months <= 0) return;

            const res = solveLinearTarget(price, initShares, cost, monthlyInvestHkd, months, targetHkd);

            const totalCostRmbStep = res.totalCostHkd / rate;
            const profitRmbStep = res.profitHkd / rate;

            const profitSignText = res.profitRate >= 0 ? '+' : '';
            const profitClass = res.profitRate >= 0 ? 'is-profit' : 'is-loss';
            const formattedMonth = String(node.month).padStart(2, '0');

            priceRowsHtml += `
                <tr>
                    <td><b>${node.year}.${formattedMonth}</b></td>
                    <td>${months}</td>
                    <td>~${Math.round(res.totalShares).toLocaleString()} 股</td>
                    <td><b>¥ ${Math.round(totalCostRmbStep).toLocaleString()}</b></td>
                    <td>${res.avgCostPrice.toFixed(2)} 港币</td>
                    <td class="highlight-cell">${res.targetPrice.toFixed(2)} 港币</td>
                    <td class="${profitClass}"><b>${profitSignText}¥ ${Math.round(profitRmbStep).toLocaleString()}</b></td>
                    <td class="${profitClass}" style="font-weight: 700;">${profitSignText}${res.profitRate.toFixed(2)}%</td>
                </tr>
            `;
        });
        priceTableBody.innerHTML = priceRowsHtml;
    }

    function refreshPrice() {
        const btn = document.getElementById('refreshPriceBtn');
        btn.classList.add('spinning');
        fetchStockPrice(() => {
            btn.classList.remove('spinning');
        });
    }

    function refreshRate() {
        const btn = document.getElementById('refreshRateBtn');
        btn.classList.add('spinning');
        fetchExchangeRate(() => {
            btn.classList.remove('spinning');
        });
    }

    function fetchStockPrice(callback) {
        const statusElem = document.getElementById('priceStatus');
        statusElem.innerText = '获取中...';
        statusElem.className = 'status-tag';

        const script = document.createElement('script');
        script.src = 'https://qt.gtimg.cn/q=hk01810?' + new Date().getTime();
        
        script.onload = function() {
            if (typeof v_hk01810 !== 'undefined') {
                const elements = v_hk01810.split('~');
                
                // 索引 3: 最新股价
                const livePrice = parseFloat(elements[3]);
                // 索引 4: 昨收价 (作为对比基准)
                const prevClose = parseFloat(elements[4]);
                // 索引 32: 今日涨跌幅 (%)
                const changeRatio = parseFloat(elements[32]);

                if (!isNaN(livePrice)) {
                    document.getElementById('currentPrice').value = livePrice.toFixed(2);
                }

                // 渲染昨收基准价
                if (!isNaN(prevClose)) {
                    document.getElementById('prevCloseDisplay').innerText = prevClose.toFixed(2) + ' HKD';
                }

                // 渲染今日涨跌幅
                if (!isNaN(changeRatio)) {
                    const ratioSign = changeRatio >= 0 ? '+' : '';
                    const displayElem = document.getElementById('changePercentDisplay');
                    displayElem.innerText = `${ratioSign}${changeRatio.toFixed(2)}%`;
                    displayElem.className = `market-value ${changeRatio >= 0 ? 'is-profit' : 'is-loss'}`;
                }

                statusElem.innerText = '● 已更新';
                statusElem.className = 'status-tag';
                calculate();
            }
            document.body.removeChild(script);
            if (callback) callback();
        };

        script.onerror = function() {
            statusElem.innerText = '● 获取失败';
            statusElem.className = 'status-tag error';
            if (callback) callback();
        };

        document.body.appendChild(script);
    }

    async function fetchExchangeRate(callback) {
        const statusElem = document.getElementById('rateStatus');
        statusElem.innerText = '获取中...';
        statusElem.className = 'status-tag';

        try {
            const response = await fetch('https://open.er-api.com/v6/latest/CNY?t=' + new Date().getTime());
            if (!response.ok) throw new Error('网络异常');
            
            const data = await response.json();
            if (data && data.rates && data.rates.HKD) {
                const liveRate = data.rates.HKD;
                document.getElementById('exchangeRate').value = liveRate.toFixed(4);
                statusElem.innerText = '● 已更新';
                statusElem.className = 'status-tag';
                calculate();
            }
        } catch (error) {
            statusElem.innerText = '● 获取失败';
            statusElem.className = 'status-tag error';
        } finally {
            if (callback) callback();
        }
    }

    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('input', function() {
            // 限制最大8位数字
            const maxLength = 8;
            const value = this.value;
            if (value.length > maxLength) {
                this.value = value.slice(0, maxLength);
            }
            calculate();
        });
    });

    calculate();
    fetchStockPrice();
    fetchExchangeRate();
</script>

</body>
